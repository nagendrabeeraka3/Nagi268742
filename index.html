<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Test Results</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Blood Test Results</h1>

    <h2>Patient Information</h2>
    <p><strong>Name:</strong> John Doe</p>
    <p><strong>Date of Birth:</strong> 1990-05-15</p>
    <p><strong>Patient ID:</strong> P12345</p>

    <h2>Test Results</h2>
    <table>
        <thead>
            <tr>
                <th>Test Name</th>
                <th>Result</th>
                <th>Reference Range</th>
                <th>Units</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Hemoglobin</td>
                <td>14.5</td>
                <td>13.0 - 17.0</td>
                <td>g/dL</td>
            </tr>
            <tr>
                <td>White Blood Cell Count</td>
                <td>7.2</td>
                <td>4.0 - 10.0</td>
                <td>x10<sup>3</sup>/uL</td>
            </tr>
            <tr>
                <td>Glucose (Fasting)</td>
                <td>95</td>
                <td>70 - 99</td>
                <td>mg/dL</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
